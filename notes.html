<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes App - Portfolio Suite</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <nav class="navbar container">
      <h1 class="logo">MyPortfolio</h1>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="notes.html" class="active">Notes App</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="container page-content">
    <section class="section">
      <h2>Notes App with Local Storage</h2>
      <p>
        Add notes below. Your notes will remain saved even after refreshing the page.
      </p>

      <div class="notes-box">
        <input type="text" id="noteTitle" placeholder="Enter note title" />
        <textarea id="noteText" rows="5" placeholder="Write your note here"></textarea>
        <button id="saveNoteBtn" class="primary-btn">Save Note</button>
        <p id="noteMessage" class="message"></p>
      </div>

      <div id="notesContainer" class="notes-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 My Portfolio Suite | Notes App</p>
  </footer>

  <script src="js/notes.js"></script>
</body>
</html>
